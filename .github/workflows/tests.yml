name: Tests

# The unit tests (tests/) on the same Python the scheduled workflows use. Runs on every push and pull request;
# touches no data, sends nothing, commits nothing.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Byte-compile every module (catches syntax the runner's Python rejects)
        run: python -m compileall -q v5_modules research_system tests

      - name: Run the test suite
        env:
          PYTHONUTF8: '1'
        run: python -m unittest discover -s tests -t . -v
