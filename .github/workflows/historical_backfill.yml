name: V5 Historical Backfill (one year at a time)

# Manual only. Fetches a full calendar year of NSE end-of-day data and stores it
# as data/market_database/history/nse_<YEAR>.parquet
#
# Run this once per year you want, starting with the most useful ones:
#   2020 (COVID crash), 2018 (correction), 2022 (drawdown), then fill the rest.
#
# It NEVER touches master_history.csv or any live signal/ledger file.
on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Calendar year to backfill (e.g. 2018). One year per run.'
        required: true
        default: '2020'
      sleep:
        description: 'Seconds between requests (raise to 1.0 if NSE rate-limits)'
        required: false
        default: '0.6'

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    # ~250 trading days at ~1-2s each = 10-20 min; generous headroom for retries
    timeout-minutes: 180

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Backfill ${{ github.event.inputs.year }}
        run: |
          mkdir -p data/market_database/history
          python v5_modules/historical_backfill.py \
            --year ${{ github.event.inputs.year }} \
            --out-dir data/market_database/history \
            --sleep ${{ github.event.inputs.sleep }}

      - name: Show what was produced
        run: |
          ls -lh data/market_database/history/ || true
          python - <<'PY'
          import glob, pandas as pd
          for f in sorted(glob.glob("data/market_database/history/*.parquet")):
              d = pd.read_parquet(f, columns=["DATE","SYMBOL","CLOSE","TRADED_VALUE"])
              print(f"{f}: {len(d):,} rows | {d['DATE'].nunique()} sessions | "
                    f"{d['SYMBOL'].nunique()} symbols | {d['DATE'].min()} -> {d['DATE'].max()}")
              # quick turnover sanity read-out
              print(f"   median daily turnover: Rs {d['TRADED_VALUE'].median():,.0f}")
          PY

      - name: Commit the year archive
        run: |
          git config user.name "v5-automation"
          git config user.email "v5-automation@users.noreply.github.com"
          git add data/market_database/history/
          git diff --cached --quiet || git commit -m "Historical backfill ${{ github.event.inputs.year }}"
          git push

      - name: Report failure
        if: failure()
        run: |
          echo "Backfill failed. Common causes:"
          echo "  1. NSE rate-limiting  -> re-run with sleep = 1.0 or higher"
          echo "  2. Year predates available archives (try 2016 or later)"
          echo "  3. Transient NSE outage -> just re-run; already-stored dates are skipped"
