name: V5 Daily Data Refresh

# Runs every weekday at 16:00 UTC = 21:30 IST (after NSE market close)
on:
  schedule:
    - cron: '0 16 * * 1-5'
  workflow_dispatch:   # allows manual trigger from GitHub UI
    inputs:
      max_back_days:
        description: 'Days of bhavcopy to fetch (default 7; use 35+ for first-run gap backfill)'
        required: false
        default: '7'

permissions:
  contents: write   # needed to commit updated data back to repo

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # We need full history for data files. Shallow clone breaks git LFS sometimes.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Decompress master history if compressed
        run: |
          mkdir -p data/market_database data/fundamentals data/live_signals logs
          if [ -f data/market_database/master_history.csv.gz ]; then
            gunzip -k -f data/market_database/master_history.csv.gz
          fi

      - name: Download latest bhavcopy
        run: |
          MAX_BACK="${{ github.event.inputs.max_back_days }}"
          if [ -z "$MAX_BACK" ]; then MAX_BACK=7; fi
          python v5_modules/bhavcopy_downloader.py \
            --master data/market_database/master_history.csv \
            --max-back-days $MAX_BACK

      - name: Refresh stale fundamentals (top 500 only — to fit in 30-min budget)
        run: |
          # Only refresh if symbols.txt exists; first run bootstraps via separate workflow
          if [ -f symbols.txt ]; then
            head -500 symbols.txt > /tmp/symbols_today.txt
            python v5_modules/screener_scraper.py \
              --bootstrap /tmp/symbols_today.txt \
              --cache-dir data/fundamentals
          fi

      # IMPORTANT ORDER:
      # paper_trade_manager MUST run BEFORE signal_generator. The signal that
      # the user saw on Telegram Monday morning lives in daily_live_portfolio.csv.
      # If signal_generator runs first, it overwrites that file with TODAY's
      # picks (or an empty file under RISK_OFF), and paper_trade_manager loses
      # the signal it was supposed to act on. So:
      #   1. paper_trade_manager reads the EXISTING file (what user already saw)
      #   2. THEN signal_generator regenerates for next reference cycle
      - name: Update paper trade positions (uses signal user saw on Telegram)
        run: |
          python v5_modules/paper_trade_manager.py \
            --master data/market_database/master_history.csv \
            --signal data/live_signals/daily_live_portfolio.csv \
            --positions data/live_signals/positions.csv \
            --equity-log data/live_signals/equity_log.csv \
            --realized data/live_signals/realized_trades.csv \
            --portfolio-inr 200000 \
            --entry-day mon \
            --max-holding-days 25

      - name: Generate V5 signals (for tomorrow's reference / next Monday)
        run: |
          python v5_modules/v5_signal_generator.py \
            --master data/market_database/master_history.csv \
            --fundamentals data/fundamentals/screener.sqlite \
            --output-dir data/live_signals \
            --top-n 15 \
            --portfolio-inr 200000 \
            --risk-pct 0.01 \
            --min-close 20 \
            --min-traded-value 10000000

      - name: Broadcast daily status to Telegram (always — heartbeat + exits if any)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python v5_modules/daily_status_broadcaster.py \
            --positions data/live_signals/positions.csv \
            --realized data/live_signals/realized_trades.csv \
            --equity-log data/live_signals/equity_log.csv \
            --regime-json data/live_signals/daily_regime.json

      - name: Generate live Excel tracker
        run: |
          python v5_modules/excel_report_generator.py \
            --positions data/live_signals/positions.csv \
            --equity-log data/live_signals/equity_log.csv \
            --realized data/live_signals/realized_trades.csv \
            --signal data/live_signals/daily_live_portfolio.csv \
            --regime-json data/live_signals/daily_regime.json \
            --master data/market_database/master_history.csv \
            --output-dir . \
            --filename V5_Live_Tracker.xlsx

      - name: Build readable email body (dashboard + picks as plain text)
        run: |
          python v5_modules/email_body_builder.py \
            --equity-log data/live_signals/equity_log.csv \
            --positions data/live_signals/positions.csv \
            --realized data/live_signals/realized_trades.csv \
            --signal data/live_signals/daily_live_portfolio.csv \
            --regime-json data/live_signals/daily_regime.json \
            --master data/market_database/master_history.csv \
            > /tmp/email_body.txt || echo "Body build failed — email_sender will fall back to --body."
          echo "----- email body preview -----"
          cat /tmp/email_body.txt || true

      - name: Email live tracker
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          if [ -f "V5_Live_Tracker.xlsx" ]; then
            python v5_modules/email_sender.py \
              --subject "V5 Daily Report — $(date -u +%a\ %d\ %b\ %Y)" \
              --body-file /tmp/email_body.txt \
              --body "Attached: open positions with current MTM, equity curve, closed trades, today's signal. This is the latest snapshot — same file is updated daily." \
              --attach "V5_Live_Tracker.xlsx"
          else
            echo "V5_Live_Tracker.xlsx not generated — skipping email."
          fi

      - name: Recompress master history
        run: |
          gzip -f data/market_database/master_history.csv

      - name: Commit updated data back to repo
        run: |
          git config user.name "v5-automation"
          git config user.email "v5-automation@users.noreply.github.com"
          git add -A data/ logs/ V5_Live_Tracker.xlsx || true
          git diff --cached --quiet || git commit -m "V5 daily refresh $(date -u +%Y-%m-%d)"
          git push

      - name: Send failure alert to Telegram
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=⚠️ V5 daily refresh FAILED on $(date -u). Check GitHub Actions logs."
