name: V5 Daily Data Refresh

# Runs every weekday at 16:00 UTC = 21:30 IST (after NSE market close)
on:
  schedule:
    - cron: '0 16 * * 1-5'
  workflow_dispatch:   # allows manual trigger from GitHub UI
    inputs:
      max_back_days:
        description: 'Days of bhavcopy to fetch (default 7; use 35+ for first-run gap backfill)'
        required: false
        default: '7'

permissions:
  contents: write   # needed to commit updated data back to repo

# Shared with the research workflows so data commits never race each other
concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # We need full history for data files. Shallow clone breaks git LFS sometimes.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Decompress master history if compressed
        run: |
          mkdir -p data/market_database data/fundamentals data/live_signals logs
          if [ -f data/market_database/master_history.csv.gz ]; then
            gunzip -k -f data/market_database/master_history.csv.gz
          fi

      # Also fetches every day after the master's last date (up to 30 days), so a run that
      # follows failed or skipped runs catches up instead of leaving permanent gaps.
      - name: Download latest bhavcopy
        run: |
          MAX_BACK="${{ github.event.inputs.max_back_days }}"
          if [ -z "$MAX_BACK" ]; then MAX_BACK=7; fi
          python v5_modules/bhavcopy_downloader.py \
            --master data/market_database/master_history.csv \
            --max-back-days $MAX_BACK

      # Split/bonus events: back-adjusts prices for the signal and rescales held
      # paper positions on their ex-date. Non-fatal: if NSE's feed is unreachable
      # the script falls back to inference and keeps the stored official events.
      - name: Update corporate actions (splits / bonuses)
        continue-on-error: true
        run: |
          python v5_modules/corporate_actions.py --update \
            --master data/market_database/master_history.csv \
            --events data/market_database/corporate_actions.csv \
            --days 30 --ahead 45

      # Capped and non-fatal: the scrape re-does every symbol that went stale since the last
      # committed run (18 min on 2026-11-20 after six uncommitted runs, 2 min normally). Stale
      # fundamentals only make the quality gate use older data; the ledger must still run.
      - name: Refresh stale fundamentals (top 500 only — to fit in 30-min budget)
        continue-on-error: true
        timeout-minutes: 25
        run: |
          # Only refresh if symbols.txt exists; first run bootstraps via separate workflow
          if [ -f symbols.txt ]; then
            head -500 symbols.txt > /tmp/symbols_today.txt
            python v5_modules/screener_scraper.py \
              --bootstrap /tmp/symbols_today.txt \
              --cache-dir data/fundamentals
          fi

      # IMPORTANT ORDER:
      # paper_trade_manager MUST run BEFORE signal_generator. The signal that
      # the user saw on Telegram Monday morning lives in daily_live_portfolio.csv.
      # If signal_generator runs first, it overwrites that file with TODAY's
      # picks (or an empty file under RISK_OFF), and paper_trade_manager loses
      # the signal it was supposed to act on. So:
      #   1. paper_trade_manager reads the EXISTING file (what user already saw)
      #   2. THEN signal_generator regenerates for next reference cycle
      - name: Update paper trade positions (uses signal user saw on Telegram)
        run: |
          python v5_modules/paper_trade_manager.py \
            --master data/market_database/master_history.csv \
            --signal data/live_signals/daily_live_portfolio.csv \
            --positions data/live_signals/positions.csv \
            --equity-log data/live_signals/equity_log.csv \
            --realized data/live_signals/realized_trades.csv \
            --portfolio-inr 200000 \
            --entry-day mon \
            --max-holding-days 0

      - name: Generate V5 signals (for tomorrow's reference / next Monday)
        run: |
          python v5_modules/v5_signal_generator.py \
            --master data/market_database/master_history.csv \
            --fundamentals data/fundamentals/screener.sqlite \
            --output-dir data/live_signals \
            --top-n 15 \
            --portfolio-inr 200000 \
            --risk-pct 0.01 \
            --min-close 20 \
            --min-traded-value 10000000

      # Advisory only: a Telegram outage must never block the Excel/email steps or the data commit
      # (2026-11-13: a read timeout here skipped the commit and lost the session's ledger update).
      # Unsent exit reports stay pending in the exit marker and are included in the next report.
      - name: Broadcast daily status to Telegram (always — heartbeat + exits if any)
        id: status
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python v5_modules/daily_status_broadcaster.py \
            --positions data/live_signals/positions.csv \
            --realized data/live_signals/realized_trades.csv \
            --equity-log data/live_signals/equity_log.csv \
            --regime-json data/live_signals/daily_regime.json

      # Reports (Excel, email) are non-fatal for the same reason as the Telegram status: the
      # ledger and data must be committed even when a report fails (2026-11-16..20: Gmail
      # refused the SMTP login every night and each failure skipped the commit). A failed
      # report step is announced on Telegram after the commit (last step).
      - name: Generate live Excel tracker
        id: excel
        continue-on-error: true
        run: |
          python v5_modules/excel_report_generator.py \
            --positions data/live_signals/positions.csv \
            --equity-log data/live_signals/equity_log.csv \
            --realized data/live_signals/realized_trades.csv \
            --signal data/live_signals/daily_live_portfolio.csv \
            --regime-json data/live_signals/daily_regime.json \
            --master data/market_database/master_history.csv \
            --output-dir . \
            --filename V5_Live_Tracker.xlsx

      - name: Update Nifty 500 benchmark and compare (non-fatal — never blocks the run)
        continue-on-error: true
        run: |
          python v5_modules/benchmark_tracker.py \
            --benchmark-csv data/market_database/benchmark_history.csv \
            --equity-log data/live_signals/equity_log.csv \
            --output-dir data/live_signals \
            --portfolio-inr 200000 \
            --max-back-days 7 || echo "Benchmark step failed — skipping (does not affect the rest of the run)."

      - name: Build readable email body (dashboard + picks as plain text)
        run: |
          python v5_modules/email_body_builder.py \
            --equity-log data/live_signals/equity_log.csv \
            --positions data/live_signals/positions.csv \
            --realized data/live_signals/realized_trades.csv \
            --signal data/live_signals/daily_live_portfolio.csv \
            --regime-json data/live_signals/daily_regime.json \
            --benchmark-json data/live_signals/benchmark_summary.json \
            --master data/market_database/master_history.csv \
            > /tmp/email_body.txt || echo "Body build failed — email_sender will fall back to --body."
          echo "----- email body preview -----"
          cat /tmp/email_body.txt || true

      - name: Email live tracker
        id: email
        continue-on-error: true
        timeout-minutes: 5
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          if [ -f "V5_Live_Tracker.xlsx" ]; then
            python v5_modules/email_sender.py \
              --subject "V5 Daily Report — $(date -u +%a\ %d\ %b\ %Y)" \
              --body-file /tmp/email_body.txt \
              --body "Attached: open positions with current MTM, equity curve, closed trades, today's signal. This is the latest snapshot — same file is updated daily." \
              --attach "V5_Live_Tracker.xlsx"
          else
            echo "V5_Live_Tracker.xlsx not generated — skipping email."
          fi

      - name: Recompress master history
        run: |
          gzip -f data/market_database/master_history.csv

      - name: Commit updated data back to repo
        run: |
          git config user.name "v5-automation"
          git config user.email "v5-automation@users.noreply.github.com"
          git add -A data/ logs/ V5_Live_Tracker.xlsx || true
          git diff --cached --quiet || git commit -m "V5 daily refresh $(date -u +%Y-%m-%d)"
          git push

      - name: Send failure alert to Telegram
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=⚠️ V5 daily refresh FAILED on $(date -u). Check GitHub Actions logs."

      # The run succeeded and the data is committed, but a non-fatal report step failed.
      - name: Alert that a report step failed (data was committed)
        if: success() && (steps.status.outcome == 'failure' || steps.excel.outcome == 'failure' || steps.email.outcome == 'failure')
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS_OUTCOME: ${{ steps.status.outcome }}
          EXCEL_OUTCOME: ${{ steps.excel.outcome }}
          EMAIL_OUTCOME: ${{ steps.email.outcome }}
        run: |
          FAILED=""
          if [ "$STATUS_OUTCOME" = "failure" ]; then FAILED="$FAILED Telegram-status"; fi
          if [ "$EXCEL_OUTCOME" = "failure" ]; then FAILED="$FAILED Excel-tracker"; fi
          if [ "$EMAIL_OUTCOME" = "failure" ]; then FAILED="$FAILED email"; fi
          HINT=""
          if [ "$EMAIL_OUTCOME" = "failure" ]; then HINT=" Email failing at login usually means the Gmail app password (secret GMAIL_APP_PASSWORD) was revoked: create a new one and update the secret."; fi
          curl -s -m 60 -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            --data-urlencode "text=⚠️ V5 daily refresh $(date -u +%Y-%m-%d): ledger and data committed, but these report steps failed:${FAILED}.${HINT} See the Actions log." || true
