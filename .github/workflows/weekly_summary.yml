name: V5 Weekly Summary

# Saturdays 03:30 UTC = 09:00 IST
on:
  schedule:
    - cron: '30 3 * * 6'
  workflow_dispatch:

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build weekly summary from positions + equity log
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python v5_modules/weekly_pnl_broadcaster.py \
            --equity-log data/live_signals/equity_log.csv \
            --positions data/live_signals/positions.csv \
            --realized data/live_signals/realized_trades.csv \
            --regime-json data/live_signals/daily_regime.json \
            --portfolio-inr 200000
